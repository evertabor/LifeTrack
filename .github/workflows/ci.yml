name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      SQL_CONTAINER_NAME: lifetrack-ux-sql-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { global-json-file: global.json }
      - run: dotnet restore --locked-mode
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build -c Release --no-restore
      - name: Install Playwright Chromium
        run: pwsh tests/LifeTrack.Playwright.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Start disposable SQL Server
        id: sqlserver
        run: |
          set -euo pipefail
          SQL_PASSWORD="$(openssl rand -hex 32)Aa1!"
          echo "::add-mask::$SQL_PASSWORD"
          docker run --detach \
            --name "$SQL_CONTAINER_NAME" \
            --env ACCEPT_EULA=Y \
            --env MSSQL_SA_PASSWORD="$SQL_PASSWORD" \
            --publish 127.0.0.1:1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

          SQL_READY=false
          for attempt in $(seq 1 60); do
            if docker exec "$SQL_CONTAINER_NAME" \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SQL_PASSWORD" -C -b -l 2 -t 5 -Q "SELECT 1" \
              >/dev/null 2>&1; then
              SQL_READY=true
              break
            fi
            if [ "$attempt" -lt 60 ]; then
              sleep 2
            fi
          done

          if [ "$SQL_READY" != "true" ]; then
            echo "::error::SQL Server did not become ready after 60 bounded attempts."
            exit 1
          fi

          SQL_CONNECTION_STRING="Server=127.0.0.1,1433;Initial Catalog=master;User ID=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=30"
          echo "::add-mask::$SQL_CONNECTION_STRING"
          printf 'connection_string=%s\n' "$SQL_CONNECTION_STRING" >> "$GITHUB_OUTPUT"
          unset SQL_PASSWORD SQL_CONNECTION_STRING
      - name: Run solution tests
        env:
          LIFETRACK_UX_TESTS_SQLSERVER_CONNECTION_STRING: ${{ steps.sqlserver.outputs.connection_string }}
        run: dotnet test -c Release --no-build --collect:"XPlat Code Coverage"
      - name: Remove disposable SQL Server
        if: always()
        run: |
          if docker container inspect "$SQL_CONTAINER_NAME" >/dev/null 2>&1; then
            docker rm --force "$SQL_CONTAINER_NAME"
          fi
      - name: Paquetes vulnerables
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.log
          ! grep -q "has the following vulnerable packages" vuln.log
